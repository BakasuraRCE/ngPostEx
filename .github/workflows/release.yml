name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ===========================================
  # Linux x86_64 - GUI AppImage
  # ===========================================
  linux-x86_64-gui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libqt6core6 \
            libqt6gui6 \
            libqt6widgets6 \
            libqt6network6 \
            libgl1-mesa-dev \
            libssl-dev \
            libfuse2 \
            file

      - name: Build GUI version
        run: |
          mkdir build && cd build
          qmake6 ../src/ngPost.pro CONFIG+=release
          make -j$(nproc)

      - name: Create AppImage
        run: |
          cd build
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp ngPostEx AppDir/usr/bin/
          cp ../src/resources/icons/ngPost.png AppDir/usr/share/icons/hicolor/256x256/apps/ngPostEx.png

          cat > AppDir/usr/share/applications/ngPostEx.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=ngPostEx
          Exec=ngPostEx
          Icon=ngPostEx
          Categories=Network;
          Comment=Usenet binary poster
          EOF
          sed -i 's/^          //' AppDir/usr/share/applications/ngPostEx.desktop

          export QMAKE=qmake6
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv ngPostEx-*.AppImage ngPostEx_${GITHUB_REF_NAME}-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-gui
          path: build/ngPostEx_*-x86_64.AppImage

  # ===========================================
  # Linux x86_64 - CMD only AppImage
  # ===========================================
  linux-x86_64-cmd:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libqt6core6 \
            libqt6network6 \
            libgl1-mesa-dev \
            libssl-dev \
            libfuse2 \
            file

      - name: Build CMD version
        run: |
          mkdir build && cd build
          qmake6 ../src/ngPost_cmd.pro CONFIG+=release
          make -j$(nproc)

      - name: Create AppImage
        run: |
          cd build
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp ngPostEx AppDir/usr/bin/
          cp ../src/resources/icons/ngPost.png AppDir/usr/share/icons/hicolor/256x256/apps/ngPostEx.png

          cat > AppDir/usr/share/applications/ngPostEx.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=ngPostEx
          Exec=ngPostEx
          Icon=ngPostEx
          Categories=Network;
          Comment=Usenet binary poster (CMD)
          Terminal=true
          EOF
          sed -i 's/^          //' AppDir/usr/share/applications/ngPostEx.desktop

          export QMAKE=qmake6
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv ngPostEx-*.AppImage ngPostEx_${GITHUB_REF_NAME}_cmd-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-cmd
          path: build/ngPostEx_*_cmd-x86_64.AppImage

  # ===========================================
  # Linux ARM64 - GUI AppImage
  # ===========================================
  linux-arm64-gui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build ARM64 GUI in container
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          dockerRunArgs: --volume "${PWD}:/workspace"
          install: |
            apt-get update
            apt-get install -y \
              build-essential \
              qt6-base-dev \
              qt6-tools-dev \
              qt6-tools-dev-tools \
              libqt6core6 \
              libqt6gui6 \
              libqt6widgets6 \
              libqt6network6 \
              libgl1-mesa-dev \
              libssl-dev \
              libfuse2 \
              file \
              wget
          run: |
            cd /workspace
            mkdir -p build && cd build
            qmake6 ../src/ngPost.pro CONFIG+=release
            make -j$(nproc)

            wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage
            wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-aarch64.AppImage
            chmod +x linuxdeploy-aarch64.AppImage linuxdeploy-plugin-qt-aarch64.AppImage

            mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
            cp ngPostEx AppDir/usr/bin/
            cp ../src/resources/icons/ngPost.png AppDir/usr/share/icons/hicolor/256x256/apps/ngPostEx.png

            cat > AppDir/usr/share/applications/ngPostEx.desktop << 'EOF'
            [Desktop Entry]
            Type=Application
            Name=ngPostEx
            Exec=ngPostEx
            Icon=ngPostEx
            Categories=Network;
            Comment=Usenet binary poster
            EOF
            sed -i 's/^            //' AppDir/usr/share/applications/ngPostEx.desktop

            export QMAKE=qmake6
            ./linuxdeploy-aarch64.AppImage --appdir AppDir --plugin qt --output appimage
            mv ngPostEx-*.AppImage ngPostEx_${GITHUB_REF_NAME}-aarch64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-gui
          path: build/ngPostEx_*-aarch64.AppImage

  # ===========================================
  # Linux ARM64 - CMD only AppImage
  # ===========================================
  linux-arm64-cmd:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build ARM64 CMD in container
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          dockerRunArgs: --volume "${PWD}:/workspace"
          install: |
            apt-get update
            apt-get install -y \
              build-essential \
              qt6-base-dev \
              qt6-tools-dev \
              qt6-tools-dev-tools \
              libqt6core6 \
              libqt6network6 \
              libgl1-mesa-dev \
              libssl-dev \
              libfuse2 \
              file \
              wget
          run: |
            cd /workspace
            mkdir -p build && cd build
            qmake6 ../src/ngPost_cmd.pro CONFIG+=release
            make -j$(nproc)

            wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage
            wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-aarch64.AppImage
            chmod +x linuxdeploy-aarch64.AppImage linuxdeploy-plugin-qt-aarch64.AppImage

            mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
            cp ngPostEx AppDir/usr/bin/
            cp ../src/resources/icons/ngPost.png AppDir/usr/share/icons/hicolor/256x256/apps/ngPostEx.png

            cat > AppDir/usr/share/applications/ngPostEx.desktop << 'EOF'
            [Desktop Entry]
            Type=Application
            Name=ngPostEx
            Exec=ngPostEx
            Icon=ngPostEx
            Categories=Network;
            Comment=Usenet binary poster (CMD)
            Terminal=true
            EOF
            sed -i 's/^            //' AppDir/usr/share/applications/ngPostEx.desktop

            export QMAKE=qmake6
            ./linuxdeploy-aarch64.AppImage --appdir AppDir --plugin qt --output appimage
            mv ngPostEx-*.AppImage ngPostEx_${GITHUB_REF_NAME}_cmd-aarch64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-cmd
          path: build/ngPostEx_*_cmd-aarch64.AppImage

  # ===========================================
  # Windows x64 - GUI
  # ===========================================
  windows-x64-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\src\ngPost.pro CONFIG+=release
          nmake

      - name: Package
        shell: pwsh
        run: |
          cd build/release
          windeployqt --release --no-translations ngPostEx.exe
          $sslPath = "$env:Qt6_DIR/bin"
          if (Test-Path "$sslPath/libssl-3-x64.dll") {
            Copy-Item "$sslPath/libssl-3-x64.dll" .
            Copy-Item "$sslPath/libcrypto-3-x64.dll" .
          }
          Compress-Archive -Path * -DestinationPath "ngPostEx_${{ github.ref_name }}_win-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-gui
          path: build/release/ngPostEx_*_win-x64.zip

  # ===========================================
  # Windows x64 - CMD
  # ===========================================
  windows-x64-cmd:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\src\ngPost_cmd.pro CONFIG+=release
          nmake

      - name: Package
        shell: pwsh
        run: |
          cd build/release
          windeployqt --release --no-translations ngPostEx.exe
          $sslPath = "$env:Qt6_DIR/bin"
          if (Test-Path "$sslPath/libssl-3-x64.dll") {
            Copy-Item "$sslPath/libssl-3-x64.dll" .
            Copy-Item "$sslPath/libcrypto-3-x64.dll" .
          }
          Compress-Archive -Path * -DestinationPath "ngPostEx_${{ github.ref_name }}_cmd_win-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-cmd
          path: build/release/ngPostEx_*_cmd_win-x64.zip

  # ===========================================
  # macOS - GUI
  # ===========================================
  macos-gui:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'

      - name: Build
        run: |
          mkdir build && cd build
          qmake ../src/ngPost.pro CONFIG+=release
          make -j$(sysctl -n hw.ncpu)

      - name: Create DMG
        run: |
          cd build
          macdeployqt ngPostEx.app -dmg
          mv ngPostEx.dmg ngPostEx_${GITHUB_REF_NAME}_macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-gui
          path: build/ngPostEx_*_macos.dmg

  # ===========================================
  # macOS - CMD
  # ===========================================
  macos-cmd:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'

      - name: Build
        run: |
          mkdir build && cd build
          qmake ../src/ngPost_cmd.pro CONFIG+=release
          make -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          cd build
          mkdir -p pkg
          cp ngPostEx pkg/
          tar -czf ngPostEx_${GITHUB_REF_NAME}_cmd_macos.tar.gz -C pkg .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-cmd
          path: build/ngPostEx_*_cmd_macos.tar.gz

  # ===========================================
  # Create GitHub Release
  # ===========================================
  release:
    needs:
      - linux-x86_64-gui
      - linux-x86_64-cmd
      - linux-arm64-gui
      - linux-arm64-cmd
      - windows-x64-gui
      - windows-x64-cmd
      - macos-gui
      - macos-cmd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir release_files
          find artifacts -type f \( -name "*.AppImage" -o -name "*.zip" -o -name "*.dmg" -o -name "*.tar.gz" \) -exec cp {} release_files/ \;
          ls -la release_files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ngPostEx ${{ github.ref_name }}"
          body: |
            ## ngPostEx ${{ github.ref_name }}

            Fork of [ngPost](https://github.com/mbruel/ngPost) by Matthieu Bruel.

            ### Changes
            See [release_notes.txt](https://github.com/BakasuraRCE/ngPostEx/blob/master/release_notes.txt) for full changelog.

            ### Downloads

            | Platform | GUI | CMD (headless) |
            |----------|-----|----------------|
            | **Linux x86_64** | `ngPostEx_*-x86_64.AppImage` | `ngPostEx_*_cmd-x86_64.AppImage` |
            | **Linux ARM64** | `ngPostEx_*-aarch64.AppImage` | `ngPostEx_*_cmd-aarch64.AppImage` |
            | **Windows x64** | `ngPostEx_*_win-x64.zip` | `ngPostEx_*_cmd_win-x64.zip` |
            | **macOS (Intel)** | `ngPostEx_*_macos.dmg` | `ngPostEx_*_cmd_macos.tar.gz` |

            ### Notes
            - **GUI** versions include the graphical interface but also work from command line.
            - **CMD** versions are for headless/server environments without a display server.
            - All builds use **Qt 6** and **OpenSSL 3**.
            - Default config file: `~/.ngPostEx` (Linux/macOS) or `ngPostEx.conf` (Windows)

          files: release_files/*
          draft: false
          prerelease: false
