name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ===========================================
  # Linux x86_64 - GUI & CMD
  # ===========================================
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libssl-dev \
            libfuse2 \
            file

      - name: Build GUI version
        run: |
          mkdir build-gui && cd build-gui
          qmake ../src/ngPost.pro CONFIG+=release
          make -j$(nproc)

      - name: Build CMD version
        run: |
          mkdir build-cmd && cd build-cmd
          qmake ../src/ngPost_cmd.pro CONFIG+=release
          make -j$(nproc)

      - name: Create GUI AppImage
        run: |
          cd build-gui
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp ngPostEx AppDir/usr/bin/
          cp ../src/resources/icons/ngPost.png AppDir/usr/share/icons/hicolor/256x256/apps/ngPostEx.png

          cat > AppDir/usr/share/applications/ngPostEx.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=ngPostEx
          Exec=ngPostEx
          Icon=ngPostEx
          Categories=Network;
          Comment=Usenet binary poster
          EOF
          sed -i 's/^          //' AppDir/usr/share/applications/ngPostEx.desktop

          export QMAKE=qmake
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv ngPostEx-*.AppImage ngPostEx_${GITHUB_REF_NAME}-x86_64.AppImage

      - name: Create CMD AppImage
        run: |
          cd build-cmd
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp ngPostEx AppDir/usr/bin/
          cp ../src/resources/icons/ngPost.png AppDir/usr/share/icons/hicolor/256x256/apps/ngPostEx.png

          cat > AppDir/usr/share/applications/ngPostEx.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=ngPostEx
          Exec=ngPostEx
          Icon=ngPostEx
          Categories=Network;
          Comment=Usenet binary poster (CMD)
          Terminal=true
          EOF
          sed -i 's/^          //' AppDir/usr/share/applications/ngPostEx.desktop

          export QMAKE=qmake
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv ngPostEx-*.AppImage ngPostEx_${GITHUB_REF_NAME}_cmd-x86_64.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            build-gui/ngPostEx_*-x86_64.AppImage
            build-cmd/ngPostEx_*_cmd-x86_64.AppImage

  # ===========================================
  # Linux ARM64 - GUI & CMD (native ARM runner)
  # ===========================================
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libssl-dev \
            libfuse2 \
            file

      - name: Build GUI version
        run: |
          mkdir build-gui && cd build-gui
          qmake ../src/ngPost.pro CONFIG+=release
          make -j$(nproc)

      - name: Build CMD version
        run: |
          mkdir build-cmd && cd build-cmd
          qmake ../src/ngPost_cmd.pro CONFIG+=release
          make -j$(nproc)

      - name: Create GUI AppImage
        run: |
          cd build-gui
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-aarch64.AppImage
          chmod +x linuxdeploy-aarch64.AppImage linuxdeploy-plugin-qt-aarch64.AppImage

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp ngPostEx AppDir/usr/bin/
          cp ../src/resources/icons/ngPost.png AppDir/usr/share/icons/hicolor/256x256/apps/ngPostEx.png

          cat > AppDir/usr/share/applications/ngPostEx.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=ngPostEx
          Exec=ngPostEx
          Icon=ngPostEx
          Categories=Network;
          Comment=Usenet binary poster
          EOF
          sed -i 's/^          //' AppDir/usr/share/applications/ngPostEx.desktop

          export QMAKE=qmake
          ./linuxdeploy-aarch64.AppImage --appdir AppDir --plugin qt --output appimage
          mv ngPostEx-*.AppImage ngPostEx_${GITHUB_REF_NAME}-aarch64.AppImage

      - name: Create CMD AppImage
        run: |
          cd build-cmd
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-aarch64.AppImage
          chmod +x linuxdeploy-aarch64.AppImage linuxdeploy-plugin-qt-aarch64.AppImage

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp ngPostEx AppDir/usr/bin/
          cp ../src/resources/icons/ngPost.png AppDir/usr/share/icons/hicolor/256x256/apps/ngPostEx.png

          cat > AppDir/usr/share/applications/ngPostEx.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=ngPostEx
          Exec=ngPostEx
          Icon=ngPostEx
          Categories=Network;
          Comment=Usenet binary poster (CMD)
          Terminal=true
          EOF
          sed -i 's/^          //' AppDir/usr/share/applications/ngPostEx.desktop

          export QMAKE=qmake
          ./linuxdeploy-aarch64.AppImage --appdir AppDir --plugin qt --output appimage
          mv ngPostEx-*.AppImage ngPostEx_${GITHUB_REF_NAME}_cmd-aarch64.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            build-gui/ngPostEx_*-aarch64.AppImage
            build-cmd/ngPostEx_*_cmd-aarch64.AppImage

  # ===========================================
  # Windows x64 - GUI & CMD
  # ===========================================
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build GUI
        shell: cmd
        run: |
          mkdir build-gui
          cd build-gui
          qmake ..\src\ngPost.pro CONFIG+=release
          nmake

      - name: Build CMD
        shell: cmd
        run: |
          mkdir build-cmd
          cd build-cmd
          qmake ..\src\ngPost_cmd.pro CONFIG+=release
          nmake

      - name: Package GUI
        shell: pwsh
        run: |
          mkdir dist-gui
          Copy-Item build-gui/release/ngPostEx.exe dist-gui/
          cd dist-gui
          windeployqt --release --no-translations ngPostEx.exe
          $sslPath = "$env:Qt6_DIR/bin"
          if (Test-Path "$sslPath/libssl-3-x64.dll") {
            Copy-Item "$sslPath/libssl-3-x64.dll" .
            Copy-Item "$sslPath/libcrypto-3-x64.dll" .
          }
          Compress-Archive -Path * -DestinationPath "ngPostEx_${{ github.ref_name }}_win-x64.zip"

      - name: Package CMD
        shell: pwsh
        run: |
          mkdir dist-cmd
          Copy-Item build-cmd/release/ngPostEx.exe dist-cmd/
          cd dist-cmd
          windeployqt --release --no-translations ngPostEx.exe
          $sslPath = "$env:Qt6_DIR/bin"
          if (Test-Path "$sslPath/libssl-3-x64.dll") {
            Copy-Item "$sslPath/libssl-3-x64.dll" .
            Copy-Item "$sslPath/libcrypto-3-x64.dll" .
          }
          Compress-Archive -Path * -DestinationPath "ngPostEx_${{ github.ref_name }}_cmd_win-x64.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist-gui/ngPostEx_*_win-x64.zip
            dist-cmd/ngPostEx_*_cmd_win-x64.zip

  # ===========================================
  # Create GitHub Release (Linux + Windows)
  # ===========================================
  release:
    needs: [linux-x86_64, linux-arm64, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x86_64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts/linux-x86_64

      - name: Download Linux ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: artifacts/linux-arm64

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: artifacts/windows-x64

      - name: Collect release files
        run: |
          mkdir release_files
          find artifacts -type f \( -name "*.AppImage" -o -name "*.zip" \) -exec cp {} release_files/ \;
          ls -la release_files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ngPostEx ${{ github.ref_name }}"
          body: |
            ## ngPostEx ${{ github.ref_name }}

            Fork of [ngPost](https://github.com/mbruel/ngPost) by Matthieu Bruel.

            ### Changes
            See [release_notes.txt](https://github.com/BakasuraRCE/ngPostEx/blob/master/release_notes.txt) for full changelog.

            ### Downloads

            | Platform | GUI | CMD (headless) |
            |----------|-----|----------------|
            | **Linux x86_64** | `ngPostEx_*-x86_64.AppImage` | `ngPostEx_*_cmd-x86_64.AppImage` |
            | **Linux ARM64** | `ngPostEx_*-aarch64.AppImage` | `ngPostEx_*_cmd-aarch64.AppImage` |
            | **Windows x64** | `ngPostEx_*_win-x64.zip` | `ngPostEx_*_cmd_win-x64.zip` |
            | **macOS (ARM)** | `ngPostEx_*_macos.dmg` | `ngPostEx_*_cmd_macos.tar.gz` |

            ### Notes
            - **GUI** versions include the graphical interface but also work from command line.
            - **CMD** versions are for headless/server environments without a display server.
            - All builds use **Qt 6** and **OpenSSL 3**.
            - Default config file: `~/.ngPostEx` (Linux/macOS) or `ngPostEx.conf` (Windows)
            - macOS builds are added separately when the runner becomes available.

          files: release_files/*
          draft: false
          prerelease: false

  # ===========================================
  # Docker image (GitHub Container Registry)
  # ===========================================
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ngpostex
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # macOS - GUI & CMD (independent, appends to release)
  # ===========================================
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'

      - name: Build GUI
        run: |
          mkdir build-gui && cd build-gui
          qmake ../src/ngPost.pro CONFIG+=release
          make -j$(sysctl -n hw.ncpu)

      - name: Build CMD
        run: |
          mkdir build-cmd && cd build-cmd
          qmake ../src/ngPost_cmd.pro CONFIG+=release
          make -j$(sysctl -n hw.ncpu)

      - name: Package GUI (DMG)
        run: |
          cd build-gui
          macdeployqt ngPostEx.app -dmg
          mv ngPostEx.dmg ngPostEx_${GITHUB_REF_NAME}_macos.dmg

      - name: Package CMD (tar.gz)
        run: |
          cd build-cmd
          mkdir -p pkg
          cp ngPostEx pkg/
          tar -czf ngPostEx_${GITHUB_REF_NAME}_cmd_macos.tar.gz -C pkg .

      - name: Upload macOS artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-gui/ngPostEx_*_macos.dmg
            build-cmd/ngPostEx_*_cmd_macos.tar.gz
